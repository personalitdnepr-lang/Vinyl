<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Вінil — плеєр</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вінil">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B1F1D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F1D;
    --bg-elev:#232825;
    --bg-elev2:#2B312D;
    --accent:#E8A33D;
    --accent-soft:rgba(232,163,61,.16);
    --teal:#4C7468;
    --text:#EDE6D6;
    --text-dim:#93998F;
    --danger:#C9634B;
    --border:rgba(237,230,214,.09);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .app{max-width:520px; margin:0 auto; height:100vh; display:flex; flex-direction:column;}

  /* header */
  header{padding:22px 20px 14px; display:flex; align-items:baseline; justify-content:space-between;}
  header h1{font-size:26px; letter-spacing:.2px;}
  header h1 i{color:var(--accent); font-style:italic; font-weight:500;}
  .track-count{font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim);}

  /* tabs */
  .tabs{display:flex; gap:6px; padding:0 20px 14px; border-bottom:1px solid var(--border);}
  .tab{
    background:none; border:none; color:var(--text-dim); font-family:'Inter';
    font-size:14px; font-weight:600; padding:8px 4px 12px; cursor:pointer;
    border-bottom:2px solid transparent; margin-right:14px;
  }
  .tab.active{color:var(--accent); border-color:var(--accent);}

  main{flex:1; overflow-y:auto; padding:14px 20px 140px; -webkit-overflow-scrolling:touch;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* buttons */
  .btn{
    background:var(--accent); color:#1B1F1D; border:none; border-radius:10px;
    padding:12px 18px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Inter';
  }
  .btn.ghost{background:var(--bg-elev2); color:var(--text); border:1px solid var(--border);}
  .btn.small{padding:8px 12px; font-size:12.5px;}
  .btn.danger{background:var(--danger); color:#fff;}
  input[type=file]{display:none;}

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty p{margin:6px 0 18px; font-size:14px; line-height:1.5;}

  /* track row */
  .track-row{
    display:flex; align-items:center; gap:12px; padding:11px 0;
    border-bottom:1px solid var(--border);
  }
  .track-row .idx{
    font-family:'Space Mono'; font-size:11px; color:var(--text-dim); width:20px; flex-shrink:0;
  }
  .track-row .meta{flex:1; min-width:0;}
  .track-row .meta .name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .track-row .meta .sub{font-size:11.5px; color:var(--text-dim); font-family:'Space Mono'; margin-top:2px;}
  .track-row.playing .name{color:var(--accent);}
  .track-row .row-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:4px 6px;
  }
  .icon-btn.accent{color:var(--accent);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:6px 0 8px;}
  .section-head h2{font-size:18px;}

  /* playlists grid */
  .pl-card{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:10px; cursor:pointer;
  }
  .pl-card h3{font-size:16px; margin-bottom:4px;}
  .pl-card .sub{font-size:12px; color:var(--text-dim); font-family:'Space Mono';}

  .new-pl-row{display:flex; gap:8px; margin-bottom:16px;}
  .new-pl-row input{
    flex:1; background:var(--bg-elev2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:'Inter'; font-size:14px;
  }
  .new-pl-row input:focus{outline:1px solid var(--accent);}

  .back-link{color:var(--accent); font-size:13px; font-weight:600; background:none; border:none; margin-bottom:14px; cursor:pointer; padding:0;}

  .checklist-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .checklist-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent);}

  /* mini player */
  .mini-player{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    background:var(--bg-elev); border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:none; align-items:center; gap:12px; cursor:pointer;
  }
  .mini-player.show{display:flex;}
  .mini-vinyl{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background: radial-gradient(circle at center, #111 0 4px, var(--teal) 4px 6px, #14181a 6px 100%);
    animation: spin 3.5s linear infinite; animation-play-state:paused;
  }
  .mini-vinyl.spin{animation-play-state:running;}
  .mini-info{flex:1; min-width:0;}
  .mini-info .name{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-info .bar{height:2px; background:var(--border); border-radius:2px; margin-top:6px; overflow:hidden;}
  .mini-info .bar-fill{height:100%; background:var(--accent); width:0%;}
  .mini-controls{display:flex; gap:2px; align-items:center;}
  .mini-controls button{background:none; border:none; color:var(--text); font-size:22px; padding:4px 8px; cursor:pointer;}

  /* full player overlay */
  .player-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:none; flex-direction:column; padding:0 26px;
    padding-top:calc(env(safe-area-inset-top) + 10px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
    max-width:520px; margin:0 auto;
  }
  .player-overlay.show{display:flex;}
  .player-top{display:flex; justify-content:space-between; align-items:center; padding:6px 0 10px;}
  .player-top button{background:none;border:none;color:var(--text-dim); font-size:26px; cursor:pointer;}
  .player-top .label{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); font-family:'Space Mono';}

  .vinyl-wrap{flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:0;}
  .tonearm{
    position:absolute; top:6%; right:8%; width:90px; height:90px;
    transform-origin: 88% 12%; transform: rotate(-28deg);
    transition: transform .4s ease; z-index:2; pointer-events:none;
  }
  .tonearm.playing{transform: rotate(0deg);}
  .tonearm svg{width:100%; height:100%;}
  .vinyl{
    width:min(64vw,280px); height:min(64vw,280px); border-radius:50%;
    background:
      repeating-radial-gradient(circle at center, #17110a 0 2px, #241a0f 2px 4px);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
    position:relative;
    animation: spin 4s linear infinite; animation-play-state:paused;
  }
  .vinyl.spin{animation-play-state:running;}
  .vinyl::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle at center, transparent 30%, rgba(232,163,61,.06) 31%, transparent 32%);
  }
  .vinyl .label{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:34%; height:34%; border-radius:50%;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'Fraunces'; font-size:11px; font-weight:600; color:#1B1F1D; padding:6px;
    line-height:1.15; overflow:hidden;
  }
  .vinyl .spindle{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:8px; height:8px; border-radius:50%; background:#1B1F1D;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .now-playing-info{text-align:center; padding:18px 0 6px;}
  .now-playing-info .title{font-size:22px; margin-bottom:4px;}
  .now-playing-info .sub{font-size:12.5px; color:var(--text-dim); font-family:'Space Mono';}

  .seek-row{padding:14px 0 4px;}
  input[type=range]{
    -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
    background:var(--border); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer; margin-top:-5px;
  }
  .time-row{display:flex; justify-content:space-between; font-family:'Space Mono'; font-size:11px; color:var(--text-dim); margin-top:4px;}

  .main-controls{display:flex; align-items:center; justify-content:center; gap:26px; padding:16px 0 6px;}
  .main-controls button{background:none; border:none; color:var(--text); cursor:pointer;}
  .main-controls .play-btn{
    width:64px; height:64px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:#1B1F1D;
  }
  .main-controls .play-btn svg{width:26px; height:26px;}
  .main-controls .side-btn svg{width:26px; height:26px;}
  .main-controls .side-btn.active{color:var(--accent);}

  .bottom-row{display:flex; justify-content:center; gap:34px; padding:10px 0 4px;}
  .bottom-row button{background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .bottom-row button.active{color:var(--accent);}
  .bottom-row svg{width:18px; height:18px;}

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:var(--bg-elev2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:20px; font-size:13px; z-index:60;
    opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Він<i>il</i></h1>
    <div class="track-count" id="trackCount">0 треків</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="library">Бібліотека</button>
    <button class="tab" data-tab="playlists">Плейлисти</button>
  </div>

  <main>
    <!-- LIBRARY -->
    <section class="screen active" id="screen-library">
      <div class="section-head">
        <h2>Усі треки</h2>
        <button class="btn small" id="importBtn">+ Додати файли</button>
      </div>
      <input type="file" id="fileInput" accept="audio/*" multiple>
      <div id="libraryList"></div>
      <div class="empty" id="libraryEmpty" style="display:none;">
        <p>Тут поки порожньо.<br>Додайте аудіофайли з Файлів / iCloud — вони збережуться в застосунку.</p>
        <button class="btn" id="importBtn2">Обрати файли</button>
      </div>
    </section>

    <!-- PLAYLISTS LIST -->
    <section class="screen" id="screen-playlists">
      <div class="new-pl-row">
        <input type="text" id="newPlName" placeholder="Назва нового плейлиста">
        <button class="btn small" id="createPlBtn">Створити</button>
      </div>
      <div id="playlistsList"></div>
      <div class="empty" id="playlistsEmpty" style="display:none;">
        <p>Немає жодного плейлиста.<br>Створіть перший — введіть назву вище.</p>
      </div>
    </section>

    <!-- PLAYLIST DETAIL -->
    <section class="screen" id="screen-pl-detail">
      <button class="back-link" id="plBack">← Усі плейлисти</button>
      <div class="section-head">
        <h2 id="plDetailName">Плейлист</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn small ghost" id="plAddTracksBtn">+ Треки</button>
          <button class="btn small danger" id="plDeleteBtn">Видалити</button>
        </div>
      </div>
      <div id="plDetailList"></div>
      <div class="empty" id="plDetailEmpty" style="display:none;">
        <p>У плейлисті ще немає треків.</p>
        <button class="btn" id="plAddTracksBtn2">Додати треки</button>
      </div>
    </section>

    <!-- ADD TO PLAYLIST PICKER -->
    <section class="screen" id="screen-add-picker">
      <button class="back-link" id="pickerBack">← Назад</button>
      <h2 style="margin-bottom:12px;">Обрати треки</h2>
      <div id="pickerList"></div>
      <div style="padding-top:16px;">
        <button class="btn" id="pickerDoneBtn" style="width:100%;">Готово</button>
      </div>
    </section>
  </main>

  <!-- MINI PLAYER -->
  <div class="mini-player" id="miniPlayer">
    <div class="mini-vinyl" id="miniVinyl"></div>
    <div class="mini-info">
      <div class="name" id="miniName">—</div>
      <div class="bar"><div class="bar-fill" id="miniBarFill"></div></div>
    </div>
    <div class="mini-controls">
      <button id="miniPrev">⏮</button>
      <button id="miniPlayPause">▶</button>
      <button id="miniNext">⏭</button>
    </div>
  </div>
</div>

<!-- FULL PLAYER -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-top">
    <button id="collapsePlayer">⌄</button>
    <div class="label" id="playerContext">ЗАРАЗ ГРАЄ</div>
    <button style="opacity:0; pointer-events:none;">⌄</button>
  </div>

  <div class="vinyl-wrap">
    <div class="tonearm" id="tonearm">
      <svg viewBox="0 0 90 90">
        <circle cx="78" cy="12" r="7" fill="#3a3a3a"/>
        <line x1="78" y1="12" x2="20" y2="78" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="78" r="4" fill="#c9c9c9"/>
      </svg>
    </div>
    <div class="vinyl" id="vinylDisc">
      <div class="label" id="vinylLabel">—</div>
      <div class="spindle"></div>
    </div>
  </div>

  <div class="now-playing-info">
    <div class="title" id="npTitle">—</div>
    <div class="sub" id="npSub">—</div>
  </div>

  <div class="seek-row">
    <input type="range" id="seekBar" min="0" max="100" value="0">
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
  </div>

  <div class="main-controls">
    <button class="side-btn" id="shuffleBtn" title="Перемішати">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l5 5M15 15l6 6"/></svg>
    </button>
    <button id="prevBtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="play-btn" id="playPauseBtn">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="nextBtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg></button>
    <button class="side-btn" id="repeatBtn" title="Повтор">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
    </button>
  </div>

  <div class="bottom-row">
    <button id="addToPlFromPlayer">＋ У плейлист</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- utils ----------
  function uid(){
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);
    });
  }
  function fmtTime(s){
    if (!isFinite(s) || s<0) s=0;
    var m=Math.floor(s/60), sec=Math.floor(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }
  function fmtSize(bytes){
    if (bytes>1e6) return (bytes/1e6).toFixed(1)+' МБ';
    return (bytes/1e3).toFixed(0)+' КБ';
  }
  function cleanName(filename){
    return filename.replace(/\.[^/.]+$/, '');
  }
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  // ---------- IndexedDB ----------
  var DB_NAME='vinylPlayerDB', DB_VERSION=1, db;
  function openDB(){
    return new Promise(function(resolve,reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e){
        var _db = e.target.result;
        if (!_db.objectStoreNames.contains('tracks')) _db.createObjectStore('tracks', {keyPath:'id'});
        if (!_db.objectStoreNames.contains('playlists')) _db.createObjectStore('playlists', {keyPath:'id'});
      };
      req.onsuccess = function(e){ db=e.target.result; resolve(db); };
      req.onerror = function(e){ reject(e); };
    });
  }
  function tx(store, mode){ return db.transaction(store, mode||'readonly').objectStore(store); }
  function dbGetAll(store){
    return new Promise(function(resolve,reject){
      var req = tx(store).getAll();
      req.onsuccess=function(){resolve(req.result||[]);};
      req.onerror=reject;
    });
  }
  function dbPut(store, obj){
    return new Promise(function(resolve,reject){
      var req = tx(store,'readwrite').put(obj);
      req.onsuccess=function(){resolve();};
      req.onerror=reject;
    });
  }
  function dbDelete(store, id){
    return new Promise(function(resolve,reject){
      var req = tx(store,'readwrite').delete(id);
      req.onsuccess=function(){resolve();};
      req.onerror=reject;
    });
  }

  // ---------- state ----------
  var tracks = [];       // {id,name,blob,size,addedAt,duration}
  var playlists = [];    // {id,name,trackIds:[],createdAt}
  var queue = [];        // array of track ids, current playback order
  var queueContextLabel = 'БІБЛІОТЕКА';
  var currentIndex = -1;
  var shuffleOn = false;
  var repeatMode = 'off'; // off | all | one
  var activePlaylistId = null;
  var pickerTargetPlaylistId = null;
  var pickerSelected = new Set();
  var currentObjectUrl = null;

  var audio = new Audio();
  audio.preload = 'metadata';

  // ---------- DOM refs ----------
  var $ = function(id){ return document.getElementById(id); };
  var libraryList = $('libraryList'), libraryEmpty = $('libraryEmpty');
  var playlistsList = $('playlistsList'), playlistsEmpty = $('playlistsEmpty');
  var plDetailList = $('plDetailList'), plDetailEmpty = $('plDetailEmpty'), plDetailName = $('plDetailName');
  var pickerList = $('pickerList');
  var miniPlayer = $('miniPlayer'), miniName = $('miniName'), miniBarFill = $('miniBarFill'), miniVinyl = $('miniVinyl'), miniPlayPause = $('miniPlayPause');
  var playerOverlay = $('playerOverlay'), vinylDisc = $('vinylDisc'), vinylLabel = $('vinylLabel'), tonearm = $('tonearm');
  var npTitle = $('npTitle'), npSub = $('npSub'), seekBar = $('seekBar'), curTime = $('curTime'), durTime = $('durTime');
  var playIcon = $('playIcon'), playPauseBtn = $('playPauseBtn'), shuffleBtn = $('shuffleBtn'), repeatBtn = $('repeatBtn');

  // ---------- tabs ----------
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      showScreen('screen-'+tab.dataset.tab);
    });
  });
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    $(id).classList.add('active');
  }

  // ---------- import files ----------
  var fileInput = $('fileInput');
  $('importBtn').addEventListener('click', function(){ fileInput.click(); });
  $('importBtn2').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){
    var files = Array.from(e.target.files||[]);
    if (!files.length) return;
    var added = 0;
    var promises = files.map(function(file){
      var rec = { id: uid(), name: cleanName(file.name), blob: file, size: file.size, addedAt: Date.now() };
      tracks.push(rec);
      added++;
      return dbPut('tracks', rec);
    });
    Promise.all(promises).then(function(){
      renderLibrary();
      toast(added + (added===1?' трек додано':' треків додано'));
      fileInput.value = '';
    });
  });

  // ---------- render library ----------
  function renderLibrary(){
    $('trackCount').textContent = tracks.length + ' ' + trackWord(tracks.length);
    libraryList.innerHTML = '';
    libraryEmpty.style.display = tracks.length ? 'none' : 'block';
    tracks.forEach(function(t, i){
      var row = document.createElement('div');
      row.className = 'track-row' + (queue[currentIndex]===t.id && queueContextLabel==='БІБЛІОТЕКА' ? ' playing':'');
      row.innerHTML =
        '<div class="idx">'+(i+1)+'</div>'+
        '<div class="meta"><div class="name"></div><div class="sub">'+fmtSize(t.size)+'</div></div>'+
        '<div class="row-actions">'+
          '<button class="icon-btn addToPl" title="У плейлист">＋</button>'+
          '<button class="icon-btn danger delTrack" title="Видалити">✕</button>'+
        '</div>';
      row.querySelector('.name').textContent = t.name;
      row.addEventListener('click', function(ev){
        if (ev.target.closest('.row-actions')) return;
        playFromList(tracks.map(function(x){return x.id;}), i, 'БІБЛІОТЕКА');
      });
      row.querySelector('.addToPl').addEventListener('click', function(ev){
        ev.stopPropagation();
        quickAddToPlaylist(t.id);
      });
      row.querySelector('.delTrack').addEventListener('click', function(ev){
        ev.stopPropagation();
        deleteTrack(t.id);
      });
      libraryList.appendChild(row);
    });
  }
  function trackWord(n){
    var mod10=n%10, mod100=n%100;
    if (mod10===1 && mod100!==11) return 'трек';
    if ([2,3,4].indexOf(mod10)>-1 && [12,13,14].indexOf(mod100)===-1) return 'треки';
    return 'треків';
  }

  function deleteTrack(id){
    tracks = tracks.filter(function(t){return t.id!==id;});
    dbDelete('tracks', id);
    playlists.forEach(function(p){
      var idx = p.trackIds.indexOf(id);
      if (idx>-1){ p.trackIds.splice(idx,1); dbPut('playlists', p); }
    });
    renderLibrary();
    renderPlaylists();
    if (activePlaylistId) renderPlDetail(activePlaylistId);
  }

  // ---------- playlists ----------
  $('createPlBtn').addEventListener('click', createPlaylist);
  $('newPlName').addEventListener('keydown', function(e){ if (e.key==='Enter') createPlaylist(); });
  function createPlaylist(){
    var input = $('newPlName');
    var name = input.value.trim();
    if (!name){ toast('Введіть назву плейлиста'); return; }
    var p = { id: uid(), name: name, trackIds: [], createdAt: Date.now() };
    playlists.push(p);
    dbPut('playlists', p);
    input.value = '';
    renderPlaylists();
    toast('Плейлист створено');
  }

  function renderPlaylists(){
    playlistsList.innerHTML = '';
    playlistsEmpty.style.display = playlists.length ? 'none' : 'block';
    playlists.slice().sort(function(a,b){return b.createdAt-a.createdAt;}).forEach(function(p){
      var card = document.createElement('div');
      card.className = 'pl-card';
      card.innerHTML = '<h3></h3><div class="sub">'+p.trackIds.length+' '+trackWord(p.trackIds.length)+'</div>';
      card.querySelector('h3').textContent = p.name;
      card.addEventListener('click', function(){
        activePlaylistId = p.id;
        renderPlDetail(p.id);
        showScreen('screen-pl-detail');
      });
      playlistsList.appendChild(card);
    });
  }

  function renderPlDetail(plId){
    var p = playlists.find(function(x){return x.id===plId;});
    if (!p) return;
    plDetailName.textContent = p.name;
    plDetailList.innerHTML = '';
    plDetailEmpty.style.display = p.trackIds.length ? 'none' : 'block';
    p.trackIds.forEach(function(tid, i){
      var t = tracks.find(function(x){return x.id===tid;});
      if (!t) return;
      var row = document.createElement('div');
      row.className = 'track-row' + (queue[currentIndex]===tid && activePlaylistId===plId && queueContextLabel!=='БІБЛІОТЕКА' ? ' playing':'');
      row.innerHTML =
        '<div class="idx">'+(i+1)+'</div>'+
        '<div class="meta"><div class="name"></div><div class="sub">'+fmtSize(t.size)+'</div></div>'+
        '<div class="row-actions"><button class="icon-btn danger removeFromPl" title="Прибрати">✕</button></div>';
      row.querySelector('.name').textContent = t.name;
      row.addEventListener('click', function(ev){
        if (ev.target.closest('.row-actions')) return;
        playFromList(p.trackIds.slice(), i, p.name.toUpperCase());
      });
      row.querySelector('.removeFromPl').addEventListener('click', function(ev){
        ev.stopPropagation();
        p.trackIds.splice(i,1);
        dbPut('playlists', p);
        renderPlDetail(plId);
        renderPlaylists();
      });
      plDetailList.appendChild(row);
    });
  }

  $('plBack').addEventListener('click', function(){
    showScreen('screen-playlists');
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    document.querySelector('.tab[data-tab="playlists"]').classList.add('active');
  });

  $('plDeleteBtn').addEventListener('click', function(){
    if (!activePlaylistId) return;
    playlists = playlists.filter(function(p){return p.id!==activePlaylistId;});
    dbDelete('playlists', activePlaylistId);
    activePlaylistId = null;
    renderPlaylists();
    showScreen('screen-playlists');
  });

  // ---------- add-to-playlist picker ----------
  function openPicker(targetPlaylistId){
    pickerTargetPlaylistId = targetPlaylistId;
    var p = playlists.find(function(x){return x.id===targetPlaylistId;});
    pickerSelected = new Set(p ? p.trackIds : []);
    renderPicker();
    showScreen('screen-add-picker');
  }
  function renderPicker(){
    pickerList.innerHTML = '';
    if (!tracks.length){
      pickerList.innerHTML = '<div class="empty"><p>У бібліотеці ще немає треків.</p></div>';
      return;
    }
    tracks.forEach(function(t){
      var row = document.createElement('label');
      row.className = 'checklist-row';
      var checked = pickerSelected.has(t.id);
      row.innerHTML = '<input type="checkbox" '+(checked?'checked':'')+'><span></span>';
      row.querySelector('span').textContent = t.name;
      row.querySelector('input').addEventListener('change', function(e){
        if (e.target.checked) pickerSelected.add(t.id); else pickerSelected.delete(t.id);
      });
      pickerList.appendChild(row);
    });
  }
  $('pickerBack').addEventListener('click', function(){
    showScreen('screen-pl-detail');
  });
  $('pickerDoneBtn').addEventListener('click', function(){
    var p = playlists.find(function(x){return x.id===pickerTargetPlaylistId;});
    if (p){
      p.trackIds = Array.from(pickerSelected);
      dbPut('playlists', p);
      renderPlDetail(p.id);
      renderPlaylists();
    }
    showScreen('screen-pl-detail');
  });
  $('plAddTracksBtn').addEventListener('click', function(){ openPicker(activePlaylistId); });
  $('plAddTracksBtn2').addEventListener('click', function(){ openPicker(activePlaylistId); });

  function quickAddToPlaylist(trackId){
    if (!playlists.length){
      toast('Спершу створіть плейлист у вкладці «Плейлисти»');
      return;
    }
    // simple inline chooser via existing playlists list screen shortcut:
    // add to most recently created playlist, or prompt via checklist screen
    openMiniPlaylistChooser(trackId);
  }
  function openMiniPlaylistChooser(trackId){
    // Reuse playlists screen but with click-to-add behavior once
    var names = playlists.map(function(p){return p.name;}).join(', ');
    var choice = window.prompt('Додати трек до плейлиста. Введіть точну назву:\n('+names+')');
    if (!choice) return;
    var p = playlists.find(function(x){return x.name.toLowerCase()===choice.trim().toLowerCase();});
    if (!p){ toast('Плейлист не знайдено'); return; }
    if (p.trackIds.indexOf(trackId)===-1){
      p.trackIds.push(trackId);
      dbPut('playlists', p);
      renderPlaylists();
      toast('Додано до «'+p.name+'»');
    } else {
      toast('Вже у цьому плейлисті');
    }
  }

  // ---------- playback ----------
  function playFromList(ids, startIndex, contextLabel){
    queue = ids;
    queueContextLabel = contextLabel;
    currentIndex = startIndex;
    loadAndPlay(true);
  }

  function loadAndPlay(autoplay){
    var id = queue[currentIndex];
    var t = tracks.find(function(x){return x.id===id;});
    if (!t) return;

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(t.blob);
    audio.src = currentObjectUrl;

    npTitle.textContent = t.name;
    npSub.textContent = queueContextLabel;
    vinylLabel.textContent = t.name.length>28 ? t.name.slice(0,26)+'…' : t.name;
    miniName.textContent = t.name;
    $('playerContext').textContent = queueContextLabel;

    if (autoplay){
      audio.play().catch(function(){ /* needs user gesture, will resume on next tap */ });
    }
    updatePlayingHighlight();
    updateMediaSession(t);
    miniPlayer.classList.add('show');
  }

  function updatePlayingHighlight(){
    renderLibrary();
    if (activePlaylistId) renderPlDetail(activePlaylistId);
  }

  function setPlayingUI(playing){
    playIcon.innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    miniPlayPause.textContent = playing ? '⏸' : '▶';
    vinylDisc.classList.toggle('spin', playing);
    tonearm.classList.toggle('playing', playing);
    miniVinyl.classList.toggle('spin', playing);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  }

  audio.addEventListener('play', function(){ setPlayingUI(true); });
  audio.addEventListener('pause', function(){ setPlayingUI(false); });
  audio.addEventListener('timeupdate', function(){
    if (!audio.duration) return;
    var pct = (audio.currentTime/audio.duration)*100;
    seekBar.value = pct;
    miniBarFill.style.width = pct+'%';
    curTime.textContent = fmtTime(audio.currentTime);
    durTime.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', function(){
    if (repeatMode==='one'){ audio.currentTime=0; audio.play(); return; }
    goNext(true);
  });

  function togglePlayPause(){
    if (!queue.length) return;
    if (audio.paused) audio.play(); else audio.pause();
  }
  function goNext(auto){
    if (!queue.length) return;
    if (shuffleOn){
      currentIndex = Math.floor(Math.random()*queue.length);
    } else {
      currentIndex++;
      if (currentIndex >= queue.length){
        if (repeatMode==='all'){ currentIndex = 0; }
        else { currentIndex = queue.length-1; if(auto){setPlayingUI(false); return;} }
      }
    }
    loadAndPlay(true);
  }
  function goPrev(){
    if (!queue.length) return;
    if (audio.currentTime > 4){ audio.currentTime = 0; return; }
    currentIndex--;
    if (currentIndex < 0) currentIndex = shuffleOn ? Math.floor(Math.random()*queue.length) : 0;
    loadAndPlay(true);
  }

  playPauseBtn.addEventListener('click', togglePlayPause);
  miniPlayPause.addEventListener('click', function(e){ e.stopPropagation(); togglePlayPause(); });
  $('nextBtn').addEventListener('click', function(){ goNext(false); });
  $('prevBtn').addEventListener('click', goPrev);
  $('miniNext').addEventListener('click', function(e){ e.stopPropagation(); goNext(false); });
  $('miniPrev').addEventListener('click', function(e){ e.stopPropagation(); goPrev(); });

  shuffleBtn.addEventListener('click', function(){
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('active', shuffleOn);
    toast(shuffleOn ? 'Перемішування увімкнено' : 'Перемішування вимкнено');
  });
  repeatBtn.addEventListener('click', function(){
    repeatMode = repeatMode==='off' ? 'all' : (repeatMode==='all' ? 'one' : 'off');
    repeatBtn.classList.toggle('active', repeatMode!=='off');
    toast(repeatMode==='off' ? 'Повтор вимкнено' : (repeatMode==='all' ? 'Повтор плейлиста' : 'Повтор треку'));
  });

  seekBar.addEventListener('input', function(){
    if (!audio.duration) return;
    audio.currentTime = (seekBar.value/100)*audio.duration;
  });

  // overlay open/close
  miniPlayer.addEventListener('click', function(){ playerOverlay.classList.add('show'); });
  $('collapsePlayer').addEventListener('click', function(){ playerOverlay.classList.remove('show'); });

  $('addToPlFromPlayer').addEventListener('click', function(){
    var id = queue[currentIndex];
    if (!id) return;
    quickAddToPlaylist(id);
  });

  // ---------- Media Session (lock screen + background) ----------
  function updateMediaSession(track){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.name,
      artist: queueContextLabel === 'БІБЛІОТЕКА' ? 'Бібліотека' : queueContextLabel,
      album: 'Вінil'
    });
    navigator.mediaSession.setActionHandler('play', function(){ audio.play(); });
    navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', goPrev);
    navigator.mediaSession.setActionHandler('nexttrack', function(){ goNext(false); });
    navigator.mediaSession.setActionHandler('seekto', function(details){
      if (details.seekTime!=null) audio.currentTime = details.seekTime;
    });
  }

  // ---------- init ----------
  openDB().then(function(){
    return Promise.all([dbGetAll('tracks'), dbGetAll('playlists')]);
  }).then(function(results){
    tracks = results[0].sort(function(a,b){return a.addedAt-b.addedAt;});
    playlists = results[1];
    renderLibrary();
    renderPlaylists();
  }).catch(function(err){
    console.error(err);
    toast('Помилка сховища даних');
  });

})();
</script>
</body>
</html>
